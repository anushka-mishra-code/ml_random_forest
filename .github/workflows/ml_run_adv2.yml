name: Advanced-2 ML Pipeline

on:
  push:
    branches: [main]

jobs:
  training:
    name: "Stage 1: Training"
    runs-on: ubuntu-latest
    
    container:
      image: python:3.11-slim
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Install dependencies
        run: |
          pip install --no-cache-dir \
            scikit-learn==1.3.0 \
            pandas==2.0.0 \
            numpy==1.24.0
      
      - name: Run training script
        run: python scripts/train_model.py
      
      - name: Upload model
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: trained-model
          path: models/model.pkl

  evaluation:
    name: "Stage 2: Evaluation"
    needs: training
    runs-on: ubuntu-latest
    
    container:
      image: python:3.11-slim
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Download model from training
        uses: actions/download-artifact@v3
        with:
          name: trained-model
          path: models/
      
      - name: Install dependencies
        run: |
          pip install --no-cache-dir \
            scikit-learn==1.3.0 \
            numpy==1.24.0
      
      - name: Run evaluation script
        run: python scripts/evaluate_model.py
      
      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: model-metrics
          path: models/metrics.json

  deployment:
    name: "Stage 3: Deployment"
    needs: evaluation
    runs-on: ubuntu-latest
    
    container:
      image: python:3.11-slim
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Download metrics from evaluation
        uses: actions/download-artifact@v3
        with:
          name: model-metrics
          path: models/
      
      - name: Run deployment script
        run: python scripts/deploy_model.py
      
      - name: Success notification
        if: success()
        run: echo "✅ Pipeline completed successfully!"
      
      - name: Failure notification
        if: failure()
        run: echo "❌ Pipeline failed at one of the stages"