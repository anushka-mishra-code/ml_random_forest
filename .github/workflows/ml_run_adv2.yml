name: Advanced-2 ML Pipeline

on:
  push:
    branches: [main]

jobs:
  training:
    name: "Stage 1: Training"
    runs-on: ubuntu-latest
    
    container:
      image: python:3.11-slim
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # ↑ Changed from v6 (more stable with containers)
      
      - name: Install dependencies
        run: |
          pip install --no-cache-dir \
            scikit-learn==1.3.0 \
            pandas==2.0.0 \
            numpy==1.24.0
      
      - name: Run training script
        run: python scripts/train_model.py

  evaluation:
    name: "Stage 2: Evaluation"
    needs: training
    runs-on: ubuntu-latest
    
    container:
      image: python:3.11-slim
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          pip install --no-cache-dir \
            scikit-learn==1.3.0 \
            numpy==1.24.0
      
      - name: Run evaluation script
        run: python scripts/evaluate_model.py

  deployment:
    name: "Stage 3: Deployment"
    needs: evaluation
    runs-on: ubuntu-latest
    
    container:
      image: python:3.11-slim
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run deployment script
        run: python scripts/deploy_model.py
      
      - name: Success notification
        if: success()
        run: |
          echo "✅ ALL STAGES COMPLETED SUCCESSFULLY!"
          echo "Pipeline summary:"
          echo "  ✓ Stage 1: Training"
          echo "  ✓ Stage 2: Evaluation"
          echo "  ✓ Stage 3: Deployment"
      
      - name: Failure notification
        if: failure()
        run: echo "❌ Pipeline failed at one of the stages"